<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>sexy-db 配色候補</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#e9e9e9;color:#222;padding:24px}
h1{font-size:20px;margin:0 0 4px}
p.lead{margin:0 0 20px;color:#555;font-size:14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:32px}
.cand h2{font-size:15px;margin:0 0 8px}
.cand .swatches{display:flex;gap:6px;margin-bottom:10px}
.cand .sw{flex:1;height:28px;border-radius:6px;font-size:10px;display:flex;align-items:flex-end;padding:3px;box-sizing:border-box;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6)}
.phones{display:flex;gap:12px}
.phone{width:200px;height:400px;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-size:11px}
.top{padding:12px 14px 8px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.top .mode{font-weight:400;font-size:9px;color:var(--muted)}
.body{flex:1;padding:0 12px;overflow:hidden}
.card{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--secondary);color:var(--on-secondary);display:flex;align-items:center;justify-content:center;font-weight:700}
.card .n{font-weight:600}.card .m{color:var(--muted);font-size:10px}
.tabs{display:flex;border-top:1px solid var(--border);background:var(--surface);padding:6px 0 10px}
.tabs div{flex:1;text-align:center;font-size:9px;color:var(--muted)}
.tabs .on{color:var(--primary);font-weight:700}
.fab{position:absolute;right:14px;bottom:52px;width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.plot{background:var(--surface);border:1px solid var(--border);border-radius:12px;height:176px;position:relative;margin-bottom:8px}
.plot .g{position:absolute;left:28px;right:8px;top:8px;bottom:22px;border-left:1px solid var(--axis);border-bottom:1px solid var(--axis)}
.plot .g i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--primary);transform:translate(-50%,50%)}
.plot .g i.sel{background:var(--accent);width:11px;height:11px;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.plot .xl{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
.plot .yl{position:absolute;left:4px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left;font-size:9px;color:var(--muted)}
.sel{display:flex;gap:6px;margin-bottom:8px}
.sel div{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:10px}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px}
.sheet .t{font-size:9px;color:var(--muted);margin-bottom:4px}
.sl{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px}
.sl .lab{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:14px}
.sl .lab b{color:var(--ink);font-size:10px}
.track{height:3px;background:var(--axis);border-radius:2px;position:relative;margin:0 8px 18px}
.track .p{position:absolute;top:-9px;width:20px;height:20px;border-radius:50%;background:var(--secondary);color:var(--on-secondary);font-size:8px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);border:2px solid var(--surface)}
.track .me{position:absolute;top:-12px;width:26px;height:26px;border-radius:50%;background:var(--primary);transform:translateX(-50%);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.btn{background:var(--primary);color:var(--on-primary);text-align:center;border-radius:10px;padding:9px;font-weight:700;margin-top:6px}
.btn.o{background:transparent;color:var(--primary);border:1px solid var(--primary);margin-top:6px}
</style></head><body>
<h1>sexy-db 配色候補</h1>
<p class="lead">各候補を「一覧」「散布図」「相対指定」の 3 画面、ライト/ダークで表示。primary=操作・主役の点、accent=選択中の点、secondary=他人のアバター。</p>
<script>
const C = {
 A:{name:'A. ローズ × プラム', desc:'題材に寄せた暖色。夜のダークで映える',
   light:{bg:'#faf7f8',surface:'#ffffff',border:'#ebe3e7',ink:'#1b1419',muted:'#7a6d74',axis:'#d8ccd2',primary:'#c2185b',onp:'#ffffff',secondary:'#6b4e78',ons:'#ffffff',accent:'#f2a900'},
   dark: {bg:'#14101300',surface:'#201a1e',border:'#332a30',ink:'#f5eef2',muted:'#a89aa2',axis:'#4a3e45',primary:'#f06292',onp:'#1b1419',secondary:'#9c7fab',ons:'#1b1419',accent:'#ffc94d'}},
 B:{name:'B. インディゴ × コーラル', desc:'無難で現代的。題材を主張しない',
   light:{bg:'#f7f7fa',surface:'#ffffff',border:'#e4e4ee',ink:'#15151f',muted:'#6f6f82',axis:'#cfcfdc',primary:'#4f46e5',onp:'#ffffff',secondary:'#64748b',ons:'#ffffff',accent:'#f0735a'},
   dark: {bg:'#0f0f1a',surface:'#1a1a2e',border:'#2a2a44',ink:'#f1f1f8',muted:'#9d9db5',axis:'#3b3b5a',primary:'#818cf8',onp:'#0f0f1a',secondary:'#8b96a8',ons:'#0f0f1a',accent:'#ff8f73'}},
 C:{name:'C. ティール × アンバー', desc:'落ち着いた寒色と暖色の補色。データが読みやすい',
   light:{bg:'#f6f8f7',surface:'#ffffff',border:'#dfe7e4',ink:'#13201c',muted:'#637571',axis:'#c7d4d0',primary:'#0f766e',onp:'#ffffff',secondary:'#5b6b78',ons:'#ffffff',accent:'#d97706'},
   dark: {bg:'#0e1413',surface:'#17211f',border:'#243331',ink:'#eef4f2',muted:'#93a6a1',axis:'#35494a',primary:'#2dd4bf',onp:'#0e1413',secondary:'#8a9ba8',ons:'#0e1413',accent:'#fbbf24'}},
};
C.A.dark.bg='#141013';
const pts=[[20,30],[35,55],[50,40],[62,70],[70,35],[80,80],[45,62],[30,75],[55,20],[75,60]];
function vars(p){return `--bg:${p.bg};--surface:${p.surface};--border:${p.border};--ink:${p.ink};--muted:${p.muted};--axis:${p.axis};--primary:${p.primary};--on-primary:${p.onp};--secondary:${p.secondary};--on-secondary:${p.ons};--accent:${p.accent}`}
function phoneList(p,mode){return `<div class="phone" style="${vars(p)}"><div class="top">一覧 <span class="mode">${mode}</span></div><div class="body">
${['A子|24歳 158cm D','B美|27歳 165cm F','C香|22歳 152cm C','D子|31歳 170cm E','E奈|25歳 160cm G'].map(s=>{const[n,m]=s.split('|');return `<div class="card"><div class="av">${n[0]}</div><div><div class="n">${n}</div><div class="m">${m}</div></div></div>`}).join('')}
</div><div class="fab">+</div><div class="tabs"><div class="on">一覧</div><div>散布図</div><div>追加</div></div></div>`}
function phonePlot(p,mode){return `<div class="phone" style="${vars(p)}"><div class="top">散布図 <span class="mode">${mode}</span></div><div class="body">
<div class="sel"><div>横軸: 身長 ▾</div><div>縦軸: 顔 ▾</div></div>
<div class="plot"><div class="yl">綺麗系 →</div><div class="g">${pts.map((q,i)=>`<i ${i==3?'class="sel"':''} style="left:${q[0]}%;bottom:${q[1]}%"></i>`).join('')}</div><div class="xl">身長 (cm) →</div></div>
<div class="sheet"><div class="t">この位置の人 (2)</div><div class="card" style="margin-bottom:4px"><div class="av">D</div><div><div class="n">D子</div><div class="m">31歳 170cm E</div></div></div><div class="card" style="margin-bottom:0"><div class="av">B</div><div><div class="n">B美</div><div class="m">27歳 165cm F</div></div></div></div>
</div><div class="tabs"><div>一覧</div><div class="on">散布図</div><div>追加</div></div></div>`}
function phoneSlider(p,mode){const s=(t,l,r,pos,me)=>`<div class="sl"><div class="lab"><span>${l}</span><b>${t}</b><span>${r}</span></div><div class="track">${pos.map(([x,n])=>`<div class="p" style="left:${x}%">${n}</div>`).join('')}<div class="me" style="left:${me}%"></div></div></div>`;
return `<div class="phone" style="${vars(p)}"><div class="top">追加 2/2 <span class="mode">${mode}</span></div><div class="body">
${s('肉付き','細身','むっちり',[[18,'A'],[40,'C'],[82,'B']],60)}
${s('骨格','華奢','がっしり',[[25,'C'],[50,'A'],[75,'B']],35)}
${s('顔','可愛い系','綺麗系',[[15,'C'],[60,'A'],[88,'B']],70)}
<div class="btn">保存</div><div class="btn o">戻る</div>
</div><div class="tabs"><div>一覧</div><div>散布図</div><div class="on">追加</div></div></div>`}
let html='';
for(const k of ['A','B','C']){const c=C[k];
 for(const mode of ['light','dark']){const p=c[mode];
  html+=`<div class="cand"><h2>${c.name} <span style="font-weight:400;color:#666">(${mode})</span></h2><div style="font-size:12px;color:#555;margin-bottom:6px">${c.desc}</div>
  <div class="swatches">${['primary','accent','secondary','bg','surface','ink'].map(r=>`<div class="sw" style="background:${p[r]}">${r}<br>${p[r]}</div>`).join('')}</div>
  <div class="phones">${phoneList(p,mode)}${phonePlot(p,mode)}${phoneSlider(p,mode)}</div></div>`}}
document.write('<div class="row" style="grid-template-columns:repeat(2,1fr)">'+html+'</div>');
</script>
</body></html>
